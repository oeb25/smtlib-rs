[workspace]
members = ["smtlib", "lowlevel", "xtask"]
resolver = "2"

[workspace.package]
version = "0.4.0"
rust-version = "1.95.0"

[workspace.dependencies]
itertools = "0.15.0"
miette = { version = "7.0.0" }
serde = { version = "1.0.152", features = ["derive"] }
smtlib-lowlevel = { path = "./lowlevel", version = "0.4.0" }
thiserror = "2.0"
insta = { version = "1.40.0", features = ["ron"] }
ron = { version = "0.12.2", features = ["integer128"] }
tokio = { version = "1.37.0", features = ["io-util", "process"] }

[workspace.metadata.release]
shared-version = true
pre-release-hook = ["just", "release-hook"]
